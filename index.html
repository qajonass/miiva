<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IVA Facturación</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:10px;
}

select{
    width:95%;
    font-size:28px;
    padding:10px;
    margin-bottom:15px;
}

#pantalla{
    font-size:48px;
    font-weight:bold;
    margin:15px 0;
    min-height:60px;
}

.titulo{
    color:#aaa;
    font-size:22px;
}

.resultado{
    font-size:52px;
    font-weight:bold;
    margin-bottom:20px;
}

.teclado{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:15px;
}

button{
    font-size:34px;
    padding:18px;
    border:none;
    border-radius:8px;
}

.accion{
    width:100%;
    margin-top:10px;
    font-size:26px;
}
</style>
</head>

<body>

<select id="ivaTipo" onchange="calcular()">
    <option value="1.21">IVA 21%</option>
    <option value="1.105">IVA 10,5%</option>
</select>

<div id="pantalla">0.000</div>

<div class="titulo">NETO</div>
<div id="neto" class="resultado">0.000</div>

<div class="titulo">IVA</div>
<div id="iva" class="resultado">0.000</div>

<div class="teclado">
    <button onclick="agregar('7')">7</button>
    <button onclick="agregar('8')">8</button>
    <button onclick="agregar('9')">9</button>

    <button onclick="agregar('4')">4</button>
    <button onclick="agregar('5')">5</button>
    <button onclick="agregar('6')">6</button>

    <button onclick="agregar('1')">1</button>
    <button onclick="agregar('2')">2</button>
    <button onclick="agregar('3')">3</button>

    <button onclick="agregar('0')">0</button>
    <button onclick="agregar('.')">.</button>
    <button onclick="borrar()">⌫</button>
</div>

<button class="accion" onclick="limpiar()">C</button>
<button class="accion" onclick="siguienteFactura()">SIGUIENTE FACTURA</button>

<script>
let valor="";
let reemplazar=false;

function agregar(num){

    if(reemplazar){
        valor="";
        reemplazar=false;
    }

    if(num==="." && valor.includes(".")) return;

    valor+=num;

    mostrar();
}

function borrar(){
    valor=valor.slice(0,-1);
    mostrar();
}

function limpiar(){
    valor="";
    mostrar();
}

function siguienteFactura(){
    valor="";
    mostrar();
}

function mostrar(){

    let total=parseFloat(valor);

    document.getElementById("pantalla").innerHTML =
        valor || "0.000";

    if(isNaN(total)){
        document.getElementById("neto").innerHTML="0.000";
        document.getElementById("iva").innerHTML="0.000";
        return;
    }

    let divisor=parseFloat(
        document.getElementById("ivaTipo").value
    );

    let neto=total/divisor;
    let iva=total-neto;

    document.getElementById("neto").innerHTML=
        neto.toFixed(3);

    document.getElementById("iva").innerHTML=
        iva.toFixed(3);

    reemplazar=true;
}

function calcular(){
    mostrar();
}
</script>

</body>
</html>
