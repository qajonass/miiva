<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IVA 21%</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:15px;
}

h1{
    text-align:center;
    margin-bottom:15px;
}

#total{
    width:100%;
    font-size:42px;
    text-align:center;
    padding:15px;
    border:2px solid #ccc;
    border-radius:12px;
    background:white;
}

#resultado{
    margin-top:20px;
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
}

.valor{
    font-size:34px;
    font-weight:bold;
    margin:10px 0;
}

.etiqueta{
    color:#666;
    font-size:18px;
}

#reemplazar{
    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:22px;
    border:none;
    border-radius:12px;
    background:#1976d2;
    color:white;
}

#reemplazar:active{
    transform:scale(0.98);
}
</style>
</head>

<body>

<h1>IVA 21%</h1>

<input
    id="total"
    type="text"
    inputmode="decimal"
    placeholder="Ingrese monto"
    onclick="seleccionarTodo()"
    onfocus="seleccionarTodo()"
>

<button id="reemplazar" onclick="seleccionarTodo()">
    Reemplazar monto
</button>

<div id="resultado">
    <div class="etiqueta">Neto</div>
    <div class="valor" id="neto">0.000</div>

    <div class="etiqueta">IVA</div>
    <div class="valor" id="iva">0.000</div>
</div>

<script>
const total = document.getElementById("total");

function seleccionarTodo(){
    total.focus();
    total.select();
}

function calcular(){
    let valor = total.value.replace(",", ".");

    if(valor === ""){
        document.getElementById("neto").textContent = "0.000";
        document.getElementById("iva").textContent = "0.000";
        return;
    }

    let monto = parseFloat(valor);

    if(isNaN(monto)) return;

    let neto = monto / 1.21;
    let iva = monto - neto;

    document.getElementById("neto").textContent =
        neto.toFixed(3);

    document.getElementById("iva").textContent =
        iva.toFixed(3);
}

total.addEventListener("input", calcular);

window.onload = () => {
    total.focus();
};
</script>

</body>
</html>
