<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>MiIVA</title>

<style>
body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

h1{
    text-align:center;
    margin:10px 0 20px;
    font-size:40px;
}

#total{
    width:100%;
    font-size:48px;
    text-align:center;
    padding:20px;
    border:2px solid #ccc;
    border-radius:12px;
}

#resultado{
    margin-top:20px;
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
}

.etiqueta{
    font-size:20px;
    color:#666;
}

.valor{
    font-size:42px;
    font-weight:bold;
    margin:10px 0 25px;
}
</style>
</head>

<body>

<h1>MiIVA</h1>

<input
    id="total"
    type="text"
    inputmode="decimal"
    enterkeyhint="done"
    autocomplete="off"
    spellcheck="false"
>

<div id="resultado">

    <div class="etiqueta">NETO</div>
    <div class="valor" id="neto">0.000</div>

    <div class="etiqueta">IVA</div>
    <div class="valor" id="iva">0.000</div>

</div>

<script>

const campo = document.getElementById("total");

function calcular(){

    let texto = campo.value.trim().replace(",", ".");

    if(texto === ""){
        document.getElementById("neto").textContent = "0.000";
        document.getElementById("iva").textContent = "0.000";
        return;
    }

    let total;

    // ¿Hay una operación?
    if(texto.includes("/") || texto.includes("*") || texto.includes("+") || texto.includes("-")){

        const partes = texto.match(/^(\d+(?:\.\d+)?)([+\-*/])(\d+(?:\.\d+)?)$/);

        if(!partes) return;

        const a = parseFloat(partes[1]);
        const op = partes[2];
        const b = parseFloat(partes[3]);

        switch(op){
            case "+":
                total = a + b;
                break;

            case "-":
                total = a - b;
                break;

            case "*":
                total = a * b;
                break;

            case "/":
                if(b === 0) return;
                total = a / b;
                break;
        }

    }else{

        total = parseFloat(texto);

    }

    if(isNaN(total)) return;

    const neto = total / 1.21;
    const iva = total - neto;

    document.getElementById("neto").textContent = neto.toFixed(3);
    document.getElementById("iva").textContent = iva.toFixed(3);

}
campo.addEventListener("input", calcular);

campo.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        e.preventDefault();

        this.focus();

        setTimeout(()=>{
            this.select();
        },50);
    }
});

window.onload = () => {

    campo.focus();

    setTimeout(()=>{
        campo.focus();
    },500);
};
</script>

</body>
</html>
