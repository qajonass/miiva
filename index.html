<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora IVA 21%</title>
<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding:20px;
    background:#f5f5f5;
}
input{
    width:90%;
    max-width:300px;
    font-size:32px;
    padding:10px;
    text-align:center;
    display: block;
    margin: 0 auto 15px auto;
}
.btn-borrar {
    width: 90%;
    max-width: 320px;
    font-size: 24px;
    padding: 15px;
    background-color: #ff4d4d;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    display: block;
    margin: 0 auto 20px auto;
}
.resultado{
    margin-top:20px;
    font-size:28px;
}
</style>
</head>
<body>

<h2>IVA 21%</h2>

<input type="number" id="monto" step="0.001" placeholder="Ingrese monto">

<button class="btn-borrar" id="btnBorrar">Borrar Monto</button>

<div class="resultado">
    <p>IVA: $<span id="iva">0.000</span></p>
    <p>Sin IVA: $<span id="siniva">0.000</span></p>
</div>

<script>
const monto = document.getElementById('monto');
const btnBorrar = document.getElementById('btnBorrar');

function calcular() {
    let total = parseFloat(monto.value);
    if (isNaN(total)) {
        document.getElementById('iva').textContent = '0.000';
        document.getElementById('siniva').textContent = '0.000';
        return;
    }
    let base = total / 1.21;
    let iva = total - base;
    document.getElementById('iva').textContent = iva.toFixed(3);
    document.getElementById('siniva').textContent = base.toFixed(3);
}

monto.addEventListener('input', calcular);
btnBorrar.addEventListener('click', function() {
    monto.value = '';
    calcular();
    monto.focus();
});
</script>

</body>
</html>
