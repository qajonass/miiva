<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVA Facturación</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    margin-top:10px;
    font-size:2rem;
}

select{
    width:95%;
    max-width:500px;
    padding:15px;
    font-size:1.4rem;
    margin-bottom:20px;
}

input{
    width:95%;
    max-width:500px;
    padding:20px;
    font-size:2.5rem;
    text-align:center;
    border:none;
    border-radius:10px;
    margin-bottom:25px;
}

.titulo{
    color:#aaa;
    font-size:1.2rem;
    margin-top:10px;
}

.resultado{
    font-size:3rem;
    font-weight:bold;
    margin-bottom:25px;
}
</style>
</head>

<body>

<h1>IVA FACTURACIÓN</h1>

<select id="ivaTipo">
    <option value="1.21" selected>IVA 21%</option>
    <option value="1.105">IVA 10,5%</option>
</select>

<input
    id="total"
    type="number"
    step="0.001"
    placeholder="0.000"
    autofocus
>

<div class="titulo">NETO</div>
<div id="neto" class="resultado">0.000</div>

<div class="titulo">IVA</div>
<div id="iva" class="resultado">0.000</div>

<script>

const total = document.getElementById("total");
const ivaTipo = document.getElementById("ivaTipo");
const neto = document.getElementById("neto");
const iva = document.getElementById("iva");

function calcular(){

    let valor = parseFloat(
        total.value.replace(",", ".")
    );

    if(isNaN(valor)){
        neto.textContent = "0.000";
        iva.textContent = "0.000";
        return;
    }

    let divisor = parseFloat(ivaTipo.value);

    let netoCalc = valor / divisor;
    let ivaCalc = valor - netoCalc;

    neto.textContent = netoCalc.toFixed(3);
    iva.textContent = ivaCalc.toFixed(3);
}

total.addEventListener("input", calcular);
ivaTipo.addEventListener("change", calcular);

total.addEventListener("focus", function(){
    this.select();
});

total.addEventListener("click", function(){
    this.select();
});

window.onload = function(){
    total.focus();
};

</script>

</body>
</html>
